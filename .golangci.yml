version: "2"
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - bodyclose
    - noctx
    - gosec
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - noctx
formatters:
  enable:
    - gofmt
    - goimports
